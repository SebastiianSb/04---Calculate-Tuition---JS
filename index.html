<!DOCTYPE html>
<html lang="en">

<head>
    <link rel="stylesheet" href="style.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculate Tuition</title>
</head>

<body>
    <div class="title">
        <span id="calculate-price">Calculate Tuition</span>
    </div>
    <form action="/my-handling-form-page" method="post">

        <div id="screen-login">

        </div>
        <div class="container">
            <div class="login">
                <ul>
                    <li>
                        <label for="name">Enter your name: </label>
                        <input type="text" id="name" name="user_name" required>
                    </li>
                    <li>
                        <label for="name">Enter your Identification: </label>
                        <input type="text" id="id" name="user_id" required>
                    </li>
                    <li>
                        <label for="password">Enter your password: </label>
                        <input type="password" id="password" name="pass" required>
                        <div class="buttom">
                            <button type="button" id="btn-login">Login</button>
                        </div>
                    </li>
                </ul>
            </div>
        </div>

        <div class="simulator">
            <ul>
                <li>
                    <label for="course"> Enter the name of course you want to register: </label>
                    <input type="text" id="course" name="course_name" required>
                </li>
                <li>
                    <label for="credits">Taking into account that the price of each credit is 123,000 COP. Please, Enter
                        the amount of credits: </label>
                    <input type="number" id="credits" min="0" max="21" step="1" name="credits_amount" required>
                </li>
                <li>
                    <label for="stratum">Enter the number of your social stratum: </label>
                    <input type="number" id="stratum" min="0" max="6" step="1" name="social-stratum" required>
                </li>
                <li>
                    <label for="certificate">Does it have a voter registration certificate?</label>
                    <select name="certificate" id="cert">
                        <option value="Yes">Yes</option>
                        <option value="No">No</option>
                </li>
                </select>
                <li>
                    <div class="buttom">
                        <button type="button" id="btn-register">Register</button>
                    </div>
                </li>

            </ul>
        </div>

        <div class="results">
            <div class="outcomes">
                <ul>
                    <li>
                        <label for="name-result">Student name: </label>
                        <span id="res-name"></span>
                    </li>
                    <li>
                        <label for="id-result">Student Identification: </label>
                        <span id="res-id"></span>
                    </li>
                    <li>
                        <label for="course-result">Course name: </label>
                        <span id="res-course"></span>
                    </li>
                    <li>
                        <label for="amount-credits">Amount credits: </label>
                        <span id="res-credits"></span>
                    </li>
                    <li>
                        <label for="amount-credits-price">Credits price: </label>
                        <span id="res-amount"></span>
                    </li>
                    <li>
                        <label for="social-stratum">Social stratum: </label>
                        <span id="res-social"></span>
                    </li>
                    <li>
                        <label for="amount-credits-result">Voter certificate: </label>
                        <span id="res-certificate"></span>
                    </li>
                    <li>
                        <label for="save-money">Money saved: </label>
                        <span id="money-saved"></span>
                    </li>
                    <li>
                    <div class="buttom">
                        <button type="button" id="btn-close">Finish process</button>
                    </div>
                </li>
                </ul>
            </div>
        </div>

    </form>


    <script>

        const userName = document.getElementById('name')
        const password = document.getElementById('password')
        const id = document.getElementById('id')
        const courseName = document.getElementById('course')
        const creditsAmount = document.getElementById('credits')
        const stratum = document.getElementById('stratum')
        const certificate = document.getElementById('cert')
        const btnLogin = document.getElementById('btn-login')

        const container = document.querySelector('.container')
        const simulator = document.querySelector('.simulator')
        const results = document.querySelector('.results')
        const price = 123000

        const nameOut = document.getElementById('res-name')
        const idOut = document.getElementById('res-id')
        const courseOut = document.getElementById('res-course')
        const totalPriceOut = document.getElementById('res-amount')
        const creditsCountOut = document.getElementById('res-credits')
        const socialStratumOut = document.getElementById('res-social')
        const certificateOut = document.getElementById('res-certificate')
        const moneySave = document.getElementById('money-saved')

        const btnRegister = document.getElementById('btn-register')
        const btnClose = document.getElementById('btn-close')

        btnLogin.addEventListener('click', () => {

            if (password.value == 123) {

                simulator.style.display = 'block'

                container.style.display = 'none'

            } else {
                alert("Contraseña Incorrecta")
            }
        })

        btnRegister.addEventListener('click', function () {

            const creditsValue = Number(creditsAmount.value)
            const stratumValue = Number(stratum.value)

            if((creditsValue < 1 || creditsValue > 21 || stratumValue < 1 || stratumValue > 6)){

                alert("Porfavor ingrese valores correctos")
                return
            }

            results.style.display = 'block'
            document.querySelector('.simulator').style.display = 'none'

            nameOut.textContent = userName.value
            courseOut.textContent = courseName.value
            creditsCountOut.textContent = creditsAmount.value
            socialStratumOut.textContent = stratum.value
            certificateOut.textContent = certificate.value
            idOut.textContent = id.value
            calculateTuition()
        })
        

    function calculateTuition() {

        const stratum2 = Number(stratum.value)
        const credits = Number(creditsAmount.value)

        
        let discountCertificate = 0

        const priceCredit = price

        const subTotal = (credits * priceCredit)

        const hasCertificate = certificate.value 

        if(hasCertificate === 'Yes'){
            discountCertificate = subTotal * 0.10
        }

        const firstTotal = subTotal - discountCertificate

        let discountStratum = 0

            switch(stratum2){
            case 1:
            case 2:
                discountStratum = firstTotal * 0.15
                break;
            case 3:
            case 4:
                discountStratum = firstTotal * 0.10
                break;
            case 5:
            case 6:
                discountStratum = firstTotal * 0.05
                break;
            default: 
                discountStratum = "Invalid Stratum"
            }

        const finalTotal = firstTotal - discountStratum

        const discount = discountStratum + discountCertificate

        totalPriceOut.textContent = finalTotal
        moneySave.textContent = discount
        
    }

    btnClose.addEventListener('click', () => {
        results.style.display = 'none'
        document.querySelector('.container').style.display = 'block'

        document.getElementById('name').value = ''
        document.getElementById('id').value = ''
        document.getElementById('password').value = ''

        document.getElementById('course').value = ''
        document.getElementById('credits').value = ''
        document.getElementById('stratum').value = ''

    })
    
    </script>
</body>

</html>
