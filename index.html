<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="style.css">
    <meta charset="UTF-8"> 
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculate Tuition</title>
</head>
<body>
    <div class="title">
        <span id="calculate-price">Calculate Tuition</span>  
    </div>
    <form action="/my-handling-form-page" method="post">

        <div id="screen-login">
        
    </div>
    <div class="conteiner">
        <div class="login">
        <ul>
            <li>
                <label for="name">Enter your name: </label>
                <input type="text" id="name" name="user_name" required>
            </li>
            <li>
                <label for="password">Enter your password: </label>
                <input type="password" id="password" name="pass" required>
                <div class="buttom">
                    <button type="button" id="btn-login">Login</button>
                </div>
            </li>
        </ul>
        </div>
    </div>

    <div class="simulator">
        <ul>
            <li>
                <label for="course"> Enter the name of course you want to register: </label>
                <input type="text" id="course" name="course_name" required>
            </li>
            <li>
                <label for="credits">Taking into account that the price of each credit is 123,000 COP. Please, Enter the amount of credits: </label>
                <input type="number" id="credits" min="0" max="21" step="1" name="credits_amount" required>
            </li>
            <li>
                <label for="stratum">Enter the number of your social stratum: </label>
                <input type="number" id="stratum" min="0" max="6" step="1" name="social-stratum" required>
            </li>
            <li>
                <label for="certificate">Does it have a voter registration certificate?</label>
                <select name="certificate" id="cert">
                    <option value="Yes">Yes</option>
                    <option value="No">No</option>

                </select>
            </li>
        </ul>
    </div>

    </form>
    
        
    <script>

        const userName = document.getElementById('name')
        const password = document.getElementById('password')
        const courseName = document.getElementById('course')
        const credits_amount = document.getElementById('credits')
        const stratum = document.getElementById('stratum')
        const btnLogin = document.getElementById('btn-login')
        const simulator = document.querySelector('.simulator')
        
        btnLogin.addEventListener('click', () =>{

            const contenido = password.value

            if(contenido == 123){

                simulator.style.display = 'block'

                document.querySelector('.conteiner').style.display = 'none'
            }
        })

    </script>
</body>
</html>
